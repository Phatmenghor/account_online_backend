stages:
  - build
  - docker
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

# ========== BUILD SPRING BOOT JAR ==========
build-jar:
  stage: build
  image: maven:3.8-eclipse-temurin-17
  script:
    - echo "========================================="
    - echo "Building Spring Boot Application"
    - echo "Project account-online-backend"
    - echo "========================================="
    - mvn clean package -DskipTests
    - ls -lh target/
    - echo "Build completed account_online.jar"
  artifacts:
    paths:
      - target/account_online.jar
    expire_in: 1 hour
  tags:
    - docker
  only:
    - development

# ========== BUILD DOCKER IMAGE ==========
build-docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - build-jar
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "========================================="
    - echo "Building Docker Image"
    - echo "========================================="
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:dev-latest
    - echo "Pushing to registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:dev-latest
    - echo "Image pushed successfully!"
    - echo "Image $IMAGE_NAME:$IMAGE_TAG"
  tags:
    - docker
  only:
    - development

# ========== DEPLOY TO DEVELOPMENT SERVER ==========
deploy-dev:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - cat "$SSH_PRIVATE_KEY_DEV" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p 22 $DEV_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "========================================="
    - echo "Deploying to Development Server"
    - echo "========================================="
    - echo "Server $DEV_SERVER"
    - echo "Port 9393"
    - echo "Image $IMAGE_NAME:$IMAGE_TAG"
    - echo ""

    # Login to registry
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"

    # Pull new image
    - echo "Pulling new image..."
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker pull $IMAGE_NAME:$IMAGE_TAG"

    # Stop old container
    - echo "Stopping old container..."
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker stop account_online || true"
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker rm account_online || true"

    # Start new container
    - echo "Starting new container..."
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker run -d --name account_online --restart unless-stopped -p 9393:9393 -v /app/customer-image:/app/customer-image $IMAGE_NAME:$IMAGE_TAG"

    # Wait for app to start
    - sleep 10

    # Check container status
    - ssh -p 22 $DEV_USER@$DEV_SERVER "docker ps | grep account_online"

    - echo ""
    - echo "========================================="
    - echo "Deployment Completed Successfully!"
    - echo "========================================="
    - echo "App URL http://$DEV_SERVER:9393"
    - echo "Swagger http://$DEV_SERVER:9393/swagger-ui.html"
    - echo "Health http://$DEV_SERVER:9393/actuator/health"
    - echo ""
    - echo "Check logs docker logs -f account_online"

  environment:
    name: development
    url: http://192.168.103.106:9393
  tags:
    - docker
  only:
    - development