# ============================================
# GitLab CI/CD - Simple & Clean Configuration
# ============================================

variables:
  DOCKER_IMAGE_NAME: "account-online-springboot"
  DOCKER_IMAGE_VERSION: "1.0.0"
  JAVA_VERSION: "17"
  MAVEN_VERSION: "3.8"
  MAVEN_BUILD_IMAGE: "maven:3.8-eclipse-temurin-17"
  JAVA_RUNTIME_IMAGE: "eclipse-temurin:17-jre-jammy"
  JAR_FILE_NAME: "account_online.jar"
  APP_PORT: "9000"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  FULL_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE_NAME"

stages:
  - build
  - docker

cache:
  paths:
    - .m2/repository/
  key: ${CI_COMMIT_REF_SLUG}

build:maven:
  stage: build
  image: ${MAVEN_BUILD_IMAGE}
  script:
    - echo "🔨 Building Application"
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
    - echo "✅ Build Complete!"
    - ls -lh target/*.jar
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  tags:
    - docker

docker:build-push:
  stage: docker
  image: docker:20
  before_script:
    - echo "🔐 Logging into GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "🐳 Building Docker Image"
    - |
      cat > Dockerfile << 'DOCKERFILE'
      FROM ${JAVA_RUNTIME_IMAGE}
      WORKDIR /app
      COPY target/${JAR_FILE_NAME} app.jar
      RUN useradd -r -u 1001 -g root appuser && chown -R appuser:root /app
      USER appuser
      EXPOSE ${APP_PORT}
      ENTRYPOINT ["java", "-jar", "app.jar"]
      DOCKERFILE
    - echo "📄 Generated Dockerfile:"
    - cat Dockerfile
    - echo ""
    - echo "🔨 Building images..."
    - docker build -t ${FULL_IMAGE_NAME}:${DOCKER_IMAGE_VERSION} .
    - docker build -t ${FULL_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker build -t ${FULL_IMAGE_NAME}:latest .
    - echo ""
    - echo "⬆️  Pushing to GitLab Container Registry..."
    - docker push ${FULL_IMAGE_NAME}:${DOCKER_IMAGE_VERSION}
    - docker push ${FULL_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${FULL_IMAGE_NAME}:latest
    - echo ""
    - echo "✅ Successfully Published!"
  after_script:
    - docker image prune -af --filter "until=24h" || true
  dependencies:
    - build:maven
  tags:
    - docker
  only:
    - master
    - main
    - development
    - tags
