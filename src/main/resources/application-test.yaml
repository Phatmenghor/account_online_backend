# application.yaml

server:
  port: 9393
  servlet:
    context-path: /
  compression:
    enabled: true
  connection-timeout: 300000

spring:
  application:
    name: account_online
  security:
    user:
      name: apiuser
      password: apipass

  main:
    allow-bean-definition-overriding: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
            batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  # Primary Database (PostgreSQL)
  datasource:
    url: jdbc:postgresql://192.168.103.106:5432/account_online
    #    url: jdbc:postgresql://192.168.103.106:5432/internal_dev_uat
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 1800000
      max-lifetime: 7200000
      leak-detection-threshold: 1800000
      pool-name: PostgreSQL-Pool
      auto-commit: false

oracle:
  datasource:
    url: jdbc:oracle:thin:@//192.168.102.5:1521/dwh
    username: dwh
    password: Bnk$$444
    driver-class-name: oracle.jdbc.OracleDriver

  # Task Execution for Async Telegram notifications
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
        thread-name-prefix: async-telegram-

# Telegram Bot Configuration
telegram:
  bot:
    token: "8227113200:AAGq1I7Hs0CjkSW99M9rgrIdlHpgM8r6NMY"
    chat-id: "-4816130196"
    enabled: true




# Logging Configuration
logging:
  level:
    root: INFO
    com.internal: INFO
    com.internal.feature.report_staging: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data.jpa: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO
    org.postgresql: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/account_online.log
    max-size: 100MB
    max-history: 10

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true


