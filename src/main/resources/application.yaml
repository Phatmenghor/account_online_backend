# application.yaml - Configuration for 4-HOUR stored procedure execution

server:
  port: 8888
  servlet:
    context-path: /
  compression:
    enabled: true
  # IMPORTANT: Prevent HTTP timeout during long operations
  connection-timeout: 300000  # 5 minutes (HTTP will return immediately, job runs async)

spring:
  application:
    name: internal-dev-api

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
            batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  # Primary Database (PostgreSQL)
  datasource:
    url: jdbc:postgresql://192.168.103.106:5432/internal_dev
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 1800000      # 30 minutes
      max-lifetime: 7200000      # 2 hours
      leak-detection-threshold: 1800000  # 30 minutes (allow for long operations)
      pool-name: PostgreSQL-Pool
      auto-commit: false

# JWT Configuration
jwt:
  secret:
    key: f7e8d9c6b5a4938271605f4de3d2c1b0a9f8e7d6c5b4a392817f6e5d4c3b2a1908f7e6d5c4b3a29180716f5e4d3c2b1a001
  expiration-min: 525600 # 1 year
  issuer: internal-dev-api

# Application Configuration - 4-HOUR OPERATION SETTINGS
app:
  default-users:
    create: true
  super:
    idCard: phatmenghor19@gmail.com
    password: 88889999
    email: phatmenghor19@gmail.com

  data-load:
    batch-size: 1000
    max-retries: 1                    # Only 1 retry for 4-hour jobs
    timeout-hours: 5                  # 5-hour total timeout
    connection-timeout-minutes: 5     # 5 minutes to establish connection
    query-timeout-hours: 4           # 4 hours for query execution (0 = unlimited)
    network-timeout-hours: 5         # 5 hours network timeout
    progress-log-interval-minutes: 10 # Log progress every 10 minutes
    heartbeat-interval-minutes: 5     # Update status every 5 minutes


# Logging Configuration - REDUCED for long-running operations
logging:
  level:
    root: INFO
    com.internal: INFO
    com.internal.feature.report_staging: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data.jpa: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO              # Monitor connection pool
    com.microsoft.sqlserver: INFO        # Monitor SQL Server connections
    org.postgresql: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # File logging for long-running operations
  file:
    name: logs/cbc-long-running.log
    max-size: 100MB
    max-history: 10

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# Management Endpoints - Enhanced monitoring for long operations
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true