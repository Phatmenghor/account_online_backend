# ==============================================================
# BASE CONFIGURATION — truly shared settings only
# Default active profile: prod
# ==============================================================
spring:
  profiles:
    active: local
  application:
    name: account_online
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB

  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  datasource:
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
      pool-name: PostgreSQL-Pool
      connection-test-query: "SELECT 1"

  mail:
    host: 10.18.1.204
    port: 25
    username: ithelpdesk@cambodiapostbank.com.kh
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            trust: "*"
    default-encoding: UTF-8

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
        thread-name-prefix: async-request-log-
    scheduling:
      enabled: true

email:
  sender:
    address: ithelpdesk@cambodiapostbank.com.kh

file:
  upload:
    directory: /app/customer-image
    nid: /nid
    selfie: /selfie

request:
  log:
    retention:
      days: 30
    enabled: true
    exclude-paths:
      - /swagger-ui
      - /v3/api-docs
      - /actuator
      - /favicon.ico
      - /webjars

