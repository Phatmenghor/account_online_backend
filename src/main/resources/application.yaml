# Logging
logging:
  level:
    root: INFO
    com.internal: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
    # Request Logging specific
    com.internal.feature.auth.security.RequestLoggingFilter: DEBUG
    com.internal.feature.auth.service.RequestLogService: INFO
    com.internal.feature.auth.scheduler.RequestLogCleanupScheduler: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/account_online.log
    max-size: 100MB
    max-history: 10

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

# Scheduler Configuration
simulator:
  report-logs: false # Set to true to enable "Every Minute" simulation mode via ReportSimulator
  aml:
    error: false      # Set to true for 500 Error test
    high-risk: false
  camdx: false # Simulate CamDX Validation Failure