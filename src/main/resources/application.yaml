# application.yaml

server:
  port: 8888
  servlet:
    context-path: /
  compression:
    enabled: true
  connection-timeout: 300000

spring:
  application:
    name: internal-dev-api

  main:
    allow-bean-definition-overriding: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
            batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  # Primary Database (PostgreSQL)
  datasource:
#    url: jdbc:postgresql://192.168.103.106:5432/internal_dev
    url: jdbc:postgresql://192.168.103.106:5432/internal_dev_test
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 1800000
      max-lifetime: 7200000
      leak-detection-threshold: 1800000
      pool-name: PostgreSQL-Pool
      auto-commit: false

  # Task Execution for Async Telegram notifications
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
        thread-name-prefix: async-telegram-

# JWT Configuration
