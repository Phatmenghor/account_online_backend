        thread-name-prefix: async-telegram-

app:
  default-users:
    create: true
  super:
    idCard: phatmenghor19@gmail.com
    password: 88889999
    email: phatmenghor19@gmail.com
  data-load:
    batch-size: 1000
    max-retries: 1
    timeout-hours: 5
    connection-timeout-minutes: 5
    query-timeout-hours: 4
    network-timeout-hours: 5
    progress-log-interval-minutes: 10
    heartbeat-interval-minutes: 5

simulator:
  report-logs: false
  aml:
    error: false
    high-risk: false
  camdx: false
  banking:
    camdx-error: false
    internal-error: false

logging:
  level:
    root: INFO
    com.internal: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: ERROR
    com.internal.feature.auth.security.RequestLoggingFilter: DEBUG
    com.internal.feature.auth.service.RequestLogService: INFO
    com.internal.feature.auth.scheduler.RequestLogCleanupScheduler: INFO
    com.internal.feature.open_account: DEBUG
    com.internal.feature.aml: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{30}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{50}] - [%X{userId}] %msg%n"
  file:
    name: logs/account_online.log
    max-size: 100MB
    max-history: 10
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true