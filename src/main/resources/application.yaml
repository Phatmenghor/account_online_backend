server:
  port: 3000
  servlet:
    context-path: /
  compression:
    enabled: true

spring:
  application:
    name: internal-cbc-api

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
            batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  # Primary Database (PostgreSQL)
  datasource:
    url: jdbc:postgresql://192.168.103.106:5432/internal_cbc_report
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: PostgreSQL-Pool
      auto-commit: false

    # Secondary Database (SQL Server)
    secondary:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: "jdbc:sqlserver://10.18.1.150:1433;databaseName=T24_RAWDB_R21;encrypt=true;trustServerCertificate=true;loginTimeout=30"
      username: cpb_int
      password: "123cp!@#"
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: SQLServer-Pool

  # Task Execution for Async Operations
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25
        keep-alive: 60s
      thread-name-prefix: cbc-async-

# JWT Configuration
jwt:
  secret:
    key: f7e8d9c6b5a4938271605f4e3d2c1b0a9f8e7d6c5b4a392817f6e5d4c3b2a1908f7e6d5c4b3a29180716f5e4d3c2b1a001
  expiration-min: 525600 # 1 year
  issuer: internal-cbc-api

# Application Configuration
app:
  default-users:
    create: true
  super:
    idCard: phatmenghor19@gmail.com
    password: 88889999
    email: phatmenghor19@gmail.com
  data-load:
    batch-size: 1000
    max-retries: 3
    timeout-minutes: 30

# Logging Configuration
logging:
  level:
    root: INFO
    com.internal: INFO
    com.internal.feature.report_staging: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data.jpa: WARN
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: WARN
    com.microsoft.sqlserver: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true