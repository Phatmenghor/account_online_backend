server:
  port: 9393
  servlet:
    context-path: /
  compression:
    enabled: true
  connection-timeout: 300000

spring:
  application:
    name: account_online
  main:
    allow-bean-definition-overriding: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
            batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false

  datasource:
    url: jdbc:postgresql://192.168.103.106:5432/account_online
    username: postgres
    password: 123cp!@#
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 1800000
      max-lifetime: 7200000
      leak-detection-threshold: 1800000
      pool-name: PostgreSQL-Pool
      auto-commit: false

  # Mail configuration
  mail:
    host: 10.18.1.204
    port: 25
    username: ithelpdesk@cambodiapostbank.com.kh
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            trust: "*"
    default-encoding: UTF-8

  # Thymeleaf configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # Async Task Configuration (for request logging)
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
        thread-name-prefix: async-request-log-
    scheduling:
      enabled: true

